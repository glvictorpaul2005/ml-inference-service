services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://mluser:mlpass@postgres:5432/mlservice
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
      DB_POOL_MAX: "10"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: mluser, POSTGRES_PASSWORD: mlpass, POSTGRES_DB: mlservice}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mluser -d mlservice"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

volumes: {pgdata: {}}
